name: Refresh nightlife events

on:
  schedule:
    # Daily at 09:15 Malaysia time. GitHub schedules may run late.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify scraper rules
        run: node --test scripts/scrape-events.test.mjs
      - name: Refresh public listings
        run: node scripts/scrape-events.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- src/data/events.json; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json
          git commit -m "chore: refresh verified nightlife events"
          git push
